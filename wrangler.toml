name = "test" # Cloudflare Worker 的项目名称
main = "worker.js" # Worker 的主入口文件
compatibility_date = "2026-03-13" # 兼容性日期，用于指定使用的 Cloudflare 运行时版本
compatibility_flags = ["enable_request_signal"] # 开启 Request.signal 客户端断开感知
workers_dev = false # 关闭 test.<account>.workers.dev 子域，只走自定义域
preview_urls = false # 关闭每个版本的 preview URL

[build]
command = "npm run build:worker"
watch_dir = ["worker", "vite.worker.config.js", "scripts/build-worker.mjs", "scripts/worker-build-lib.mjs"]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# 让 wrangler tail / Workers Logs 能看到每次调用的 CPU 时间与 wall time；
# 不需要的话整段删除即可。
[observability]
enabled = true

[vars]
HOST = "xyz9923.qzz.io"
LEGACY_HOST = "test.xyz9923.qzz.io"

# 起播耗时诊断开关（默认关闭）：设为 "1" 并 deploy 后，播放请求会在控制台输出
# [proxy-trace] 分段耗时，用 `npm run tail` 实时查看；定位完再注释掉重新 deploy。
# PROXY_TRACE = "1"

# KV 命名空间绑定声明 (KV Namespace Binding)
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "KV" # 跟随线上 test worker 的绑定名（代码优先读 ENI_KV，其次 KV）
id = "b39c74bd6a244caca03ffea7ccefa466" # 命名空间 TEST-EMBY

# D1 数据库绑定声明 (D1 Database Binding)
[[d1_databases]]
binding = "DB" # 代码中调用该数据库的变量名
database_name = "emby-proxy-logs"
database_id = "b8c3419e-2fab-451c-a42a-05b8a617cc48"
